            }
            70% {

                box-shadow: 0 0 0 15px rgba(194, 242, 91, 0);

            100% {
                transform: scale(1);
                box-shadow: 0 0 0 0 rgba(194, 242, 91, 0);
            }
        }

        .primary-btn {
            display: inline-block;
            width: 100%;
            max-width: 400px;
            padding: 20px;
            background-color: #c2f25b;
            color: #000000;
            text-align: center;
            font-size: 22px;
            font-weight: bold;
            text-decoration: none;
            border-radius: 8px;
            animation: pulse 2s infinite;
        }
